version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: yt_dlp_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: galau712
      POSTGRES_DB: yt-dlp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yt-dlp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yt_dlp_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: yt_dlp_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: galau712
      DB_NAME: yt-dlp
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      REDIS_TTL_HOURS: 24
      PORT: 8080
      DOWNLOAD_DIR: /app/downloads
      CLEANUP_INTERVAL_HOURS: 1
      FILE_RETENTION_HOURS: 24
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - downloads_data:/app/downloads

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: yt_dlp_worker
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: galau712
      DB_NAME: yt-dlp
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      REDIS_TTL_HOURS: 24
      JOB_TIMEOUT_MINUTES: 15
      DOWNLOAD_DIR: /app/downloads
      CLEANUP_INTERVAL_HOURS: 1
      FILE_RETENTION_HOURS: 24
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - downloads_data:/app/downloads

volumes:
  postgres_data:
  redis_data:
  downloads_data:
